<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Landing Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #2c3e50, #3498db);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 1.5em;
    }

    .btn {
      background-color: #ffffff;
      color: #3498db;
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      font-size: 1.1em;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background-color: #ecf0f1;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9em;
      color: #ecf0f1;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2em;
      }

      .btn {
        padding: 10px 20px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>

  <h1>Welcome to My Page</h1>
  <p>Connect with me or join my Telegram community.</p>

  <!-- 🔗 Edit your links here -->
  <a href="https://yourwebsite.com" target="_blank" class="btn">Visit My Website</a>
  <a href="https://t.me/earnelite_4u" target="_blank" class="btn">Join Telegram</a>

  <footer>TEAM SLAY</footer>

</body>
</html>
